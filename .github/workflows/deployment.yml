name: Deployment

on:
  push:
    paths:
      - "terraform/**"
  workflow_dispatch: {}

jobs:
  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.0

      - name: Find environments
        id: find-envs
        run: |
          ENVS=$(ls terraform/environments/ | jq -R -s -c 'split("\n")[:-1]')
          echo "environments=$ENVS" >> $GITHUB_OUTPUT

      - name: Deploy to environments
        run: |
          for env in $(echo ${{ steps.find-envs.outputs.environments }} | jq -r '.[]'); do
            echo "Deploying to $env"
            export HETZNER_TOKEN=${{ secrets.HETZNER_TOKEN_$env }}
            if [ -z "$HETZNER_TOKEN" ]; then
              echo "No HETZNER_TOKEN_$env secret found, skipping $env"
              continue
            fi
            terraform -chdir=terraform/environments/$env init
            terraform -chdir=terraform/environments/$env apply -auto-approve
          done
